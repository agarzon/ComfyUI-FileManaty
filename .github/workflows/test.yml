name: Tests

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_call:        # release.yml / publish.yml gate their tag jobs on this

# Declared here so it applies to every caller: this job runs repo code
# (`pip install -e .`) and never needs to write anything back.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"   # the floor in pyproject's requires-python

      - name: Backend tests
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Named explicitly: `node --test <dir>` treats a directory with no test
      # files as a missing module and fails.
      - name: Frontend check
        run: node --test tests/test_upload.mjs tests/test_transfers.mjs
